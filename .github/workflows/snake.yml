name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D98B9A&color_dots=#3B3558,#8E7CC0,#B7A9D2,#DEE0FF,#FFEAFB
            dist/github-snake-dark.svg?color_snake=#D98B9A&color_dots=#3B3558,#8E7CC0,#B7A9D2,#DEE0FF,#FFEAFB
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
